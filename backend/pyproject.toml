[project]
name = "docsai-backend"
version = "0.1.0"
description = "Verified Agentic RAG backend for family documents"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "alembic>=1.13",
    "neo4j>=5.23",
    "anthropic>=0.60",
    "voyageai>=0.3",
    "langgraph>=0.2",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
# Heavy document parsers are opt-in; without them only .txt/.md ingest works.
parsing = [
    "docling>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency injection uses Depends() in argument defaults by design.
"app/api/routes/*" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
